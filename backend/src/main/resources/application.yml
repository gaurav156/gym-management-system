server:
  port: ${PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: springboot

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Flyway now owns schema changes - Hibernate only checks the schema matches what
      # the entities expect at startup and fails fast if it doesn't, rather than silently
      # altering things (which is what let the stale CHECK constraint bug happen).
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    # Your existing dev database already has all these tables (Hibernate created them via
    # ddl-auto: update over the life of this project so far). baseline-on-migrate tells
    # Flyway: on a non-empty schema with no flyway_schema_history table yet, treat
    # baseline-version as already applied without re-running its script, then continue
    # normally from the next version. A brand-new empty database (e.g. a fresh Render/
    # Supabase setup) is unaffected by this - it just runs every migration from V1 onward.
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-your-env-file-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
    remember-me-expiration-ms: ${JWT_REMEMBER_ME_EXPIRATION_MS:2592000000}   # 30 days
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173}
  seed:
    owner-email: ${OWNER_EMAIL:owner@mygym.com}
    owner-password: ${OWNER_PASSWORD:ChangeMe123!}
    owner-name: ${OWNER_NAME:Gym Owner}
  mail:
    from: ${MAIL_FROM:no-reply@mygym.com}
    gym-name: ${GYM_NAME:FitZone Gym}
    logo-url: ${GYM_LOGO_URL:}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
    max-attempts: ${CAPTCHA_MAX_ATTEMPTS:3}
    window-minutes: ${CAPTCHA_WINDOW_MINUTES:15}
    turnstile:
      secret-key: ${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    provider: ${STORAGE_PROVIDER:s3}
    # What browsers use to load images. Can differ from the endpoint the backend talks to
    # (e.g. LAN IP for phone testing, CDN domain in production).
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/gym-media}
    # One-shot: converts existing base64 photos/signatures into bucket objects on startup.
    migrate-legacy: ${STORAGE_MIGRATE_LEGACY:false}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}   # blank for real AWS S3
      region: ${STORAGE_S3_REGION:us-east-1}
      bucket: ${STORAGE_S3_BUCKET:gym-media}
      access-key: ${STORAGE_S3_ACCESS_KEY:minioadmin}
      secret-key: ${STORAGE_S3_SECRET_KEY:minioadmin}
      path-style: ${STORAGE_S3_PATH_STYLE:true}                # true for MinIO/Supabase, false for AWS/R2
    cleanup:
      enabled: ${STORAGE_CLEANUP_ENABLED:true}
      cron: ${STORAGE_CLEANUP_CRON:0 30 3 * * *}        # 3:30 AM server time, daily
      min-age-hours: ${STORAGE_CLEANUP_MIN_AGE_HOURS:24}
      max-delete: ${STORAGE_CLEANUP_MAX_DELETE:200}
      dry-run: ${STORAGE_CLEANUP_DRY_RUN:false}